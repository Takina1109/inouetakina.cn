# 每次 push 到 main，自动构建并部署到 GitHub Pages
# 官方推荐的写法，参考 https://docs.astro.build/en/guides/deploy/github/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动点一下重新部署
  workflow_dispatch:

# 克隆仓库 + 发布 Pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，避免两次 push 打架；排队等而不是互相取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site output
        uses: withastro/action@v6
        # with:
        #   node-version: 24   # 默认就是 24
        #   path: .            # Astro 项目在仓库里的位置

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
